<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imóvel | Claudinea Imóveis</title>
<meta name="description" content="Anúncio de imóvel em Contenda-PR · Claudinea Imóveis, CRECI 13.755.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--mata:#2A2A2E;--mata-2:#3A3A40;--terra:#B08D57;--terra-esc:#8E6F3E;--trigo:#D9BE8C;--creme:#F6F4F0;--creme-2:#ECE6DC;--texto:#1F2A24;--texto-2:#5F6A63;--whats:#25D366}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:var(--creme);color:var(--texto);line-height:1.65;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  .container{width:min(1160px,100% - 32px);margin-inline:auto}
  h1,h2,h3{font-family:'Outfit',sans-serif;font-weight:500;letter-spacing:-.5px;color:var(--mata)}
  header{position:sticky;top:0;z-index:50;background:rgba(244,246,249,.92);backdrop-filter:blur(10px);border-bottom:1px solid rgba(30,59,44,.08)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:88px}
  .brand b{font-family:'Outfit';font-weight:400;font-size:2.4rem;letter-spacing:.5px;color:#222;line-height:1;display:block}
  .brand small{display:block;border-top:1px solid #ccc;padding-top:4px;margin-top:4px;letter-spacing:1.8px;color:#666;font-size:.86rem}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 26px;border-radius:12px;font-weight:600;font-size:.92rem;transition:transform .2s,background .2s;border:none;cursor:pointer;font-family:'Inter'}
  .btn:hover{transform:translateY(-2px)}
  .btn svg{width:19px;height:19px;flex-shrink:0}
  .btn-mata{background:var(--mata);color:#fff}
  .btn-whats{background:var(--whats);color:#fff;width:100%}
  .btn-linha{border:1.5px solid var(--mata);color:var(--mata);background:transparent;width:100%}
  .btn-sm{padding:10px 18px;font-size:.84rem}

  .voltar{display:inline-block;margin:24px 0 16px;font-size:.88rem;color:var(--texto-2)}
  .voltar:hover{color:var(--mata)}
  .galeria{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:10px;border-radius:20px;overflow:hidden;height:min(520px,56vw)}
  .galeria.so1{grid-template-columns:minmax(0,1fr)}
  .galeria .principal{background:var(--creme-2);position:relative;cursor:zoom-in;overflow:hidden;min-height:0}
  .galeria img{width:100%;height:100%;object-fit:cover;display:block}
  .galeria .lado{display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:10px;min-height:0}
  .galeria .lado div{background:var(--creme-2);position:relative;cursor:zoom-in;overflow:hidden}
  .galeria .mais{position:absolute;inset:0;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;font-weight:600}
  .thumbs{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:4px}
  .thumbs img{width:92px;height:64px;object-fit:cover;border-radius:8px;cursor:pointer;opacity:.6;flex-shrink:0;border:2px solid transparent}
  .thumbs img.on{opacity:1;border-color:var(--terra)}

  .grid{display:grid;grid-template-columns:1fr 360px;gap:40px;margin:32px 0 80px;align-items:start}
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .tag{font-size:.76rem;font-weight:600;padding:5px 11px;border-radius:999px;background:#fff;border:1px solid rgba(30,59,44,.12);color:var(--mata)}
  .tag.escuro{background:var(--mata);color:#fff;border-color:var(--mata)}
  .tag.sim{background:#E3F4E8;color:#1E7A3C;border-color:#C5E6CF}
  .tag.nao{background:#FBEFDF;color:#8A5A1E;border-color:#F1DCBC}
  h1{font-size:clamp(1.8rem,3.4vw,2.5rem);line-height:1.12;margin-bottom:4px}
  .loc{color:var(--texto-2);margin-bottom:24px}
  .specs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:32px}
  .spec{background:#fff;border:1px solid rgba(30,59,44,.08);border-radius:14px;padding:14px 16px}
  .spec small{display:block;font-size:.72rem;letter-spacing:1px;text-transform:uppercase;color:var(--texto-2)}
  .spec b{font-family:'Outfit';font-weight:500;font-size:1.15rem;color:var(--mata)}
  h2{font-size:1.4rem;margin-bottom:12px}
  .desc{color:var(--texto-2);white-space:pre-line;margin-bottom:32px}
  .carac{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px 20px;margin-bottom:32px}
  .carac li{display:flex;gap:10px;color:var(--texto-2);font-size:.94rem}
  .carac li::before{content:"✓";color:var(--terra-esc);font-weight:700}

  .box{position:sticky;top:110px;background:#fff;border:1px solid rgba(30,59,44,.08);border-radius:20px;padding:26px;box-shadow:0 30px 50px -40px rgba(30,59,44,.5)}
  .box .label{font-size:.76rem;letter-spacing:1px;text-transform:uppercase;color:var(--texto-2)}
  .box .preco{font-family:'Outfit';font-size:2rem;font-weight:500;color:var(--mata);line-height:1.2;margin-bottom:16px}
  .cond{list-style:none;border-top:1px solid var(--creme-2);padding-top:14px;margin-bottom:20px}
  .cond li{display:flex;justify-content:space-between;font-size:.9rem;padding:6px 0;color:var(--texto-2)}
  .cond li b{font-weight:600}
  .cond .s{color:#1E7A3C}.cond .n{color:#8A5A1E}
  .box .btn{margin-bottom:10px}
  .box .creci{font-size:.78rem;color:var(--texto-2);text-align:center;margin-top:6px}

  .estado{text-align:center;padding:120px 0;color:var(--texto-2)}
  .estado h1{margin-bottom:12px}

  .lb{position:fixed;inset:0;background:rgba(10,10,12,.92);z-index:100;display:none;align-items:center;justify-content:center}
  .lb.on{display:flex}
  .lb img{max-width:92vw;max-height:86vh;border-radius:8px}
  .lb button{position:absolute;background:rgba(255,255,255,.12);color:#fff;border:none;width:48px;height:48px;border-radius:50%;font-size:1.4rem;cursor:pointer}
  .lb .x{top:20px;right:20px}.lb .p{left:20px}.lb .n{right:20px}
  .lb .c{position:absolute;bottom:20px;color:#fff;font-size:.86rem}

  footer{padding:40px 0;text-align:center;font-size:.82rem;color:var(--texto-2);border-top:1px solid rgba(30,59,44,.08)}
  .whats-float{position:fixed;bottom:22px;right:22px;z-index:60;width:62px;height:62px;border-radius:50%;background:var(--whats);display:grid;place-items:center;box-shadow:0 10px 25px -6px rgba(0,0,0,.35)}
  .whats-float svg{width:32px;height:32px;color:#fff}

  @media (max-width:900px){
    .grid{grid-template-columns:minmax(0,1fr)}
    .box{position:static}
    .galeria{grid-template-columns:minmax(0,1fr);height:62vw}
    .galeria .lado{display:none}
  }
  @media (max-width:620px){
    .brand b{font-size:2rem}
    .brand small{display:none}
    .nav{height:74px}
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="wa" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.8 14.2c-.2.7-1.4 1.3-2 1.4-.5.1-1.2.1-1.9-.1-.4-.1-1-.3-1.7-.6-3-1.3-5-4.4-5.1-4.6-.2-.2-1.2-1.6-1.2-3s.8-2.2 1-2.5c.3-.3.6-.4.8-.4h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.4.4c-.1.1-.3.3-.1.6.2.3.7 1.2 1.6 2 1.1 1 2 1.3 2.3 1.4.3.2.4.1.6-.1l.8-1c.2-.3.4-.2.6-.1l2 1c.3.1.5.2.5.3.1.2.1.7-.1 1.4Z"/></symbol>
</svg>

<header>
  <div class="container nav">
    <a href="index.html" class="brand"><b>Claudinea</b><small>Creci 13755 &nbsp;·&nbsp; imóveis</small></a>
    <a class="btn btn-mata btn-sm" id="wa-top" href="https://wa.me/5541992329582" target="_blank" rel="noopener"><svg><use href="#wa"/></svg>WhatsApp</a>
  </div>
</header>

<main class="container" id="app">
  <div class="estado">Carregando anúncio…</div>
</main>

<footer>
  <div class="container">Claudinea Imóveis · CRECI-PR 13.755 · CNAI 46.500 · (41) 99232-9582 · Rua Timóteo Cordeiro, 301 · Contenda, PR</div>
</footer>

<a class="whats-float" id="wa-float" href="https://wa.me/5541992329582" target="_blank" rel="noopener" aria-label="WhatsApp"><svg><use href="#wa"/></svg></a>

<div class="lb" id="lb"><button class="x" aria-label="Fechar">✕</button><button class="p" aria-label="Anterior">‹</button><img alt=""><button class="n" aria-label="Próxima">›</button><div class="c"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script>
(async()=>{
  const app=document.getElementById('app'), e=IMV.esc;
  const q=new URLSearchParams(location.search), cod=q.get('cod'), id=q.get('id');
  const naoAchou=()=>{app.innerHTML=`<div class="estado"><h1>Anúncio não encontrado</h1><p>Ele pode ter sido vendido ou retirado do ar.</p><p style="margin-top:20px"><a class="btn btn-mata" href="index.html#imoveis">Ver outros imóveis</a></p></div>`};
  if(!cod&&!id) return naoAchou();
  let req=sb.from('imoveis').select('*');
  req=cod?req.eq('codigo',cod):req.eq('id',id);
  const {data:i,error}=await req.maybeSingle();
  if(error||!i) return naoAchou();

  document.title=`${i.titulo} · ${i.bairro||i.cidade} | Claudinea Imóveis`;
  const loc=[i.bairro,i.cidade].filter(Boolean).join(' · ')+(String(i.cidade||'').includes('/')?'':', PR');
  const msg=`Olá! Vim pelo site e tenho interesse no imóvel cód. ${i.codigo} (${i.titulo}, ${i.bairro||i.cidade}).`;
  const wa=IMV.whats(msg);
  document.getElementById('wa-top').href=wa;document.getElementById('wa-float').href=wa;

  const fotos=(i.fotos||[]).filter(Boolean);
  const venda=i.finalidade!=='locacao';
  const sn=(b,s,n)=>`<b class="${b?'s':'n'}">${b?s:n}</b>`;

  const specs=[
    ['Área total',i.area_m2&&Number(i.area_m2).toLocaleString('pt-BR')+' m²'],
    ['Construída',i.area_construida_m2&&Number(i.area_construida_m2).toLocaleString('pt-BR')+' m²'],
    ['Quartos',i.quartos],['Suítes',i.suites],['Banheiros',i.banheiros],['Vagas',i.vagas]
  ].filter(s=>s[1]);

  app.innerHTML=`
    <a class="voltar" href="index.html#imoveis">← Voltar para os imóveis</a>
    ${fotos.length?`
    <div class="galeria${fotos.length>1?'':' so1'}">
      <div class="principal" data-i="0"><img src="${e(fotos[0])}" alt="${e(i.titulo)}"></div>
      ${fotos.length>1?`<div class="lado">
        <div data-i="1"><img src="${e(fotos[1])}" alt=""></div>
        <div data-i="2">${fotos[2]?`<img src="${e(fotos[2])}" alt="">`:''}${fotos.length>3?`<span class="mais">+${fotos.length-3} fotos</span>`:''}</div>
      </div>`:''}
    </div>
    ${fotos.length>1?`<div class="thumbs">${fotos.map((f,k)=>`<img src="${e(f)}" data-i="${k}" class="${k?'':'on'}" alt="" loading="lazy">`).join('')}</div>`:''}`:''}

    <div class="grid">
      <div>
        <div class="tags">
          <span class="tag escuro">${venda?'Venda':'Locação'}</span>
          <span class="tag">${e(IMV.tipos[i.tipo]||'Imóvel')}</span>
          <span class="tag">Cód. ${e(i.codigo)}</span>
          ${venda?(i.financia?'<span class="tag sim">Aceita financiamento</span>':'<span class="tag nao">Não financia</span>'):''}
          ${i.aceita_fgts?'<span class="tag sim">Aceita FGTS</span>':''}
          ${i.aceita_permuta?'<span class="tag sim">Aceita permuta</span>':''}
        </div>
        <h1>${e(i.titulo)}</h1>
        <div class="loc">${e(loc)}</div>
        ${specs.length?`<div class="specs">${specs.map(s=>`<div class="spec"><small>${s[0]}</small><b>${e(s[1])}</b></div>`).join('')}</div>`:''}
        ${i.descricao?`<h2>Sobre o imóvel</h2><div class="desc">${e(i.descricao)}</div>`:''}
        ${i.caracteristicas&&i.caracteristicas.length?`<h2>Características</h2><ul class="carac">${i.caracteristicas.map(c=>`<li>${e(c)}</li>`).join('')}</ul>`:''}
      </div>
      <aside class="box">
        <div class="label">${venda?'Valor de venda':'Aluguel'}</div>
        <div class="preco">${e(IMV.preco(i))}</div>
        <ul class="cond">
          ${venda?`<li>Financiamento ${sn(i.financia,'Aceita','Não aceita')}</li>
          <li>FGTS ${sn(i.aceita_fgts,'Aceita','Não aceita')}</li>
          <li>Permuta ${sn(i.aceita_permuta,'Aceita','Não aceita')}</li>`:`<li>Finalidade <b>Locação</b></li>`}
        </ul>
        <a class="btn btn-whats" href="${e(wa)}" target="_blank" rel="noopener"><svg><use href="#wa"/></svg>Tenho interesse</a>
        <a class="btn btn-linha" href="${e(IMV.whats(`Olá! Gostaria de agendar uma visita ao imóvel cód. ${i.codigo} (${i.titulo}).`))}" target="_blank" rel="noopener">Agendar visita</a>
        <button class="btn btn-linha" id="compartilhar" type="button">Compartilhar anúncio</button>
        <div class="creci">Claudinea Imóveis · CRECI-PR 13.755</div>
      </aside>
    </div>`;

  document.getElementById('compartilhar').onclick=async ev=>{
    const url=location.href;
    try{ if(navigator.share) return await navigator.share({title:i.titulo,url}); await navigator.clipboard.writeText(url); ev.target.textContent='Link copiado!'; }catch(_){}
  };

  // galeria + tela cheia
  const lb=document.getElementById('lb'), lbImg=lb.querySelector('img'), lbC=lb.querySelector('.c'); let at=0;
  const show=k=>{at=(k+fotos.length)%fotos.length;lbImg.src=fotos[at];lbC.textContent=`${at+1} / ${fotos.length}`};
  app.querySelectorAll('.galeria [data-i]').forEach(d=>d.onclick=()=>{if(fotos[+d.dataset.i]||fotos.length){show(+d.dataset.i);lb.classList.add('on')}});
  app.querySelectorAll('.thumbs img').forEach(t=>t.onclick=()=>{
    app.querySelector('.principal img').src=fotos[+t.dataset.i];app.querySelector('.principal').dataset.i=t.dataset.i;
    app.querySelectorAll('.thumbs img').forEach(x=>x.classList.toggle('on',x===t));
  });
  lb.querySelector('.x').onclick=()=>lb.classList.remove('on');
  lb.querySelector('.p').onclick=()=>show(at-1);
  lb.querySelector('.n').onclick=()=>show(at+1);
  lb.onclick=ev=>{if(ev.target===lb)lb.classList.remove('on')};
  document.addEventListener('keydown',ev=>{if(!lb.classList.contains('on'))return;if(ev.key==='Escape')lb.classList.remove('on');if(ev.key==='ArrowLeft')show(at-1);if(ev.key==='ArrowRight')show(at+1)});
})();
</script>
</body>
</html>
